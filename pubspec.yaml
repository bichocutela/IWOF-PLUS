name: iwof_plus
description: Vagas e avisos por região, com interface Flutter.
publish_to: none
version: 0.13.32+54
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_local_notifications: ^19.4.2
  workmanager: 0.9.2
  # Keep the federated implementations compatible with the shared interface.
  workmanager_android: 0.9.2
  workmanager_platform_interface: 0.9.3
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  url_launcher: ^6.3.2
  intl: ^0.20.2
  image_picker: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

