name: Flutter Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev
          flutter pub get
          pip install -r server/requirements.txt
      - name: Format, analyze and tests
        run: |
          dart format --output=write lib test
          flutter analyze
          flutter test
          PYTHONPATH=server python -m pytest server/tests -q
      - name: Configure persistent signing if provided
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$SIGNING_ALIAS" && -n "$SIGNING_PASSWORD" ]]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/iwof-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/iwof-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing secrets missing; test APK only (no public Release)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify approved permanent signing certificate
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: '9B:23:2E:5C:CA:4B:00:E9:6B:6D:B2:10:20:80:2B:FC:53:31:09:BA:33:F0:F0:D3:E3:87:4F:AF:7E:36:C1:0D'
        run: |
          set -euo pipefail
          actual=$(keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          if [[ "${actual^^}" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Release keystore certificate mismatch. Stop publishing."
            exit 1
          fi
          echo "Approved permanent release certificate verified."
      - name: Build APK for installation tests
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=MONITOR_URL="$MONITOR_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: IWOF-PLUS-android-test
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish signed GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FULL_VERSION=$(sed -n 's/^version: //p' pubspec.yaml | head -n1)
          VERSION="${FULL_VERSION%%+*}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists. Increase pubspec version to publish again."
            exit 0
          fi
          cp build/app/outputs/flutter-apk/app-release.apk IWOF-PLUS-arm64.apk
          sha256sum IWOF-PLUS-arm64.apk > IWOF-PLUS-arm64.apk.sha256
          gh release create "$TAG" IWOF-PLUS-arm64.apk IWOF-PLUS-arm64.apk.sha256 \
            --target "$GITHUB_SHA" --title "IWOF PLUS $TAG" \
            --generate-notes --latest
