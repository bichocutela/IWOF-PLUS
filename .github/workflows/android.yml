name: Flutter Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev
          flutter pub get
          pip install -r server/requirements.txt
      - name: Format, analyze and tests
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          PYTHONPATH=server python -m pytest server/tests -q
      - name: Build APK for installation tests
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=MONITOR_URL="$MONITOR_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: IWOF-PLUS-android-test
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
